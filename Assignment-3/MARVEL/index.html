<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARVEL UNIVERSE</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="logo">
      <span class="logo-squid">MARVEL</span>
      <span class="logo-game">UNIVERSE<span class="logo-plus"></span></span>
    </div>

    <ul class="nav-links">
      <li><a href="#">About</a></li>
      <li><a href="#" class="active">Watch now</a></li>
      <li><a href="#">Actors</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <div class="hamburger">
      <i class="ri-menu-3-line"></i>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">

    <!-- LEFT CONTENT -->
    <div class="hero-left">
      <div class="hero-title">
        <div class="title-squid">
          <span class="diamond yellow">◆</span>
          MARVEL
          <span class="diamond cyan">◆</span>
        </div>
        <div class="title-game">UNIVERSE<span class="plus"></span></div>
      </div>

      <p class="tagline">
        Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br>
        Season 1: 9 Episodes
      </p>

      <div class="hero-btns">
        <button class="btn-play">
          <span class="play-icon"><i class="ri-play-fill"></i></span>
          Play Now
        </button>
        <button class="btn-trailer">
          <i class="ri-play-line"></i>
          Watch Trailer
        </button>
      </div>

      <!-- BG TEXT -->
      <div class="bg-text">MARVEL</div>
    </div>

    <!-- SCROLL INDICATOR -->
    <div class="scroll-indicator">
      <div class="scroll-line"></div>
      <span>SCROLL</span>
    </div>

    <!-- HERO IMAGE -->
    <div class="hero-image">
        <img src="./assets/image_copy_2-removebg-preview.png">
      </div>
      <!-- BG watermark text -->
      <div class="side-text">IRONMAN</div>
    </div>

    <!-- SOCIAL ICONS -->
    <div class="social-icons">
      <a href="#"><i class="ri-twitter-x-line"></i></a>
      <a href="#"><i class="ri-instagram-line"></i></a>
      <a href="#"><i class="ri-facebook-line"></i></a>
    </div>

  </section>

  <!-- BOTTOM CARDS -->
  <section class="cards-section">
    <div class="card">
      <div class="card-img">
        <img src="./assets/image.png">
      </div>
      <button class="play-btn"><i class="ri-play-fill"></i></button>
      <div class="card-label">
        <span class="series-tag">MARVEL</span>
        <span class="card-title">UNIVERSE</span>
      </div>
    </div>

    <div class="card">
      <div class="card-img">
        <img src="./assets/image copy.png">
      </div>
      <button class="play-btn"><i class="ri-play-fill"></i></button>
    </div>

    <div class="card">
      <div class="card-img">
        <img src="./assets/image copy 2.png">
      </div>
      <button class="play-btn"><i class="ri-play-fill"></i></button>
    </div>
  </section>

</body>
</html>
