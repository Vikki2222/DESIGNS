<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOID — NFT Art Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="#">V O I D</a>
      <nav class="nav">
        <a href="#" class="nav-link active">Explore</a>
        <a href="#" class="nav-link">Collections</a>
        <a href="#" class="nav-link">Artists</a>
        <a href="#" class="nav-link">Activity</a>
      </nav>
      <div class="header-actions">
        <button class="btn-ghost">Connect Wallet</button>
        <div class="avatar"></div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- GRID -->
    <div class="grid">

      <div class="card" style="--delay:0.05s">
        <div class="card-img" style="background: linear-gradient(135deg,#1a1a2e,#2d2042);">
          <img src="assets/image.png"alt="Monocular" onerror="this.style.display='none'" />
          <div class="card-overlay">
            <span class="card-tag">3D</span>
          </div>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="card-name">Monocular</span>
            <div class="card-likes">
              54.8k
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="card" style="--delay:0.1s">
        <div class="card-img" style="background: linear-gradient(135deg,#0d1117,#1c1028);">
          <img src="assets/image 1.png" alt="Horns Mask" onerror="this.style.display='none'" />
          <div class="card-overlay">
            <span class="card-tag">Digital</span>
          </div>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="card-name">Horns Mask</span>
            <div class="card-likes">
              32.4k
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="card" style="--delay:0.15s">
        <div class="card-img" style="background: linear-gradient(135deg,#0a1628,#1a2540);">
          <img src="assets/image 2.png" alt="Light Moon" onerror="this.style.display='none'" />
          <div class="card-overlay">
            <span class="card-tag">AI Art</span>
          </div>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="card-name">Light Moon</span>
            <div class="card-likes">
              88.6k
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="card" style="--delay:0.2s">
        <div class="card-img" style="background: linear-gradient(135deg,#1a1a1a,#2a1f2f);">
          <img src="assets/image 3.png" alt="Skull Wire" onerror="this.style.display='none'" />
          <div class="card-overlay">
            <span class="card-tag">3D</span>
          </div>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="card-name">Skull Wire</span>
            <div class="card-likes">
              78.9k
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="card featured" style="--delay:0.25s">
        <div class="card-img" style="background: linear-gradient(135deg,#1a0a0a,#2a1515);">
          <img src="assets/image 4.png" alt="Spiderman" onerror="this.style.display='none'" />
          <div class="card-overlay">
            <span class="card-tag">AI Art</span>
          </div>
          <div class="featured-badge">Hot 🔥</div>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="card-name">Spiderman</span>
            <div class="card-likes">
              24.8k
            </div>
          </div>
          <button class="bid-btn active">Place Bid</button>
        </div>
      </div>

      <div class="card" style="--delay:0.3s">
        <div class="card-img" style="background: linear-gradient(135deg,#0d1a0d,#1a2b1a);">
          <img src="assets/image 5.png"alt="DeadPool" onerror="this.style.display='none'" />
          <div class="card-overlay">
            <span class="card-tag">Digital</span>
          </div>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="card-name">DeadPool</span>
            <div class="card-likes">
              59.7k
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="card" style="--delay:0.35s">
        <div class="card-img" style="background: linear-gradient(135deg,#0f0f1a,#1a1a30);">
          <img src="assets/image 6.png" alt="White Eye" onerror="this.style.display='none'" />
          <div class="card-overlay">
            <span class="card-tag">3D</span>
          </div>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="card-name">White Eye</span>
            <div class="card-likes">
              45.7k
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="card" style="--delay:0.4s">
        <div class="card-img" style="background: linear-gradient(135deg,#0a1a1a,#102828);">
          <img src="assets/image copy.png" alt="Plastic Spinal" onerror="this.style.display='none'" />
          <div class="card-overlay">
            <span class="card-tag">AI Art</span>
          </div>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="card-name">Plastic Spinal</span>
            <div class="card-likes">
              98.6k
            </div>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
